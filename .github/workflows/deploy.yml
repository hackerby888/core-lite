name: Deploy

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        required: true
        default: "Release"
        type: string
      build-dir:
        description: "Build directory"
        required: false
        default: "build"
        type: string
      epoch:
        description: "Epoch number"
        required: true
        type: number
      epoch-file:
        description: "Path to epoch file"
        required: true
        type: string
      peers:
        description: "Comma-separated list of peer addresses"
        required: true
        type: string
        default: ""


# Deploys over SSH; needs no write access to the repository itself.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    uses: ./.github/workflows/linux-build.yml
    with:
      configuration: "Release"
      build_dir: "build"

  deploy-linux:
    name: deploy-linux
    needs: build-linux
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: QubicLiteLinuxBuild-${{ inputs.configuration }}
          path: ${{ inputs.build-dir }}

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}

      - name: Deploy to multiple servers
        run: |
          # Check if there are no build artifacts then exit
            if [ ! -f "${INPUTS_BUILD_DIR}/src/Qubic" ]; then
              echo "Build artifact not found!"
              exit 1
            fi
          
          # Check if there are no servers then exit
            if [ -z "${VARS_SERVERS}" ]; then
              echo "No servers specified for deployment."
              exit 0
            fi
          
          # Constant initialization
          Executable=Qubic-${INPUTS_EPOCH}
          
          # Loop through each server and deploy
          for server in ${VARS_SERVERS}; do
            echo "Deploying to $server..."
            scp -o StrictHostKeyChecking=no ${INPUTS_BUILD_DIR}/src/Qubic $server:/root/
            ssh -o StrictHostKeyChecking=no $server /bin/bash "
              # Start deployment commands here
              sudo apt update && upgrade
              sudo apt install -y build-essential clang cmake nasm
              sudo apt install -y libc++-dev libc++abi-dev
              cd /root
              # Install unzip wget if not present
              sudo apt-get update
              sudo apt-get install -y unzip wget cronolog
          
              # Set up deployment directory
              mkdir -p qlite-${INPUTS_EPOCH}
              mv /root/Qubic qlite-${INPUTS_EPOCH}/$Executable
              cd qlite-${INPUTS_EPOCH}
              chmod +x ./$Executable
          
              # Download and unzip epoch file
              wget ${INPUTS_EPOCH_FILE}
              unzip $(basename ${INPUTS_EPOCH_FILE})
          
              pkill Qubic-* || echo "No existing process found."
              sleep 2
              nohup sh -c 'stdbuf -oL -eL ./$Executable -s 32 --peers "${INPUTS_PEERS}" 2>&1 | cronolog ./logs/qubic-%Y-%m-%d.log' > /dev/null 2>&1 &
              "
          done
        env:
          INPUTS_BUILD_DIR: ${{ inputs.build-dir }}
          VARS_SERVERS: ${{ vars.SERVERS }}
          INPUTS_EPOCH: ${{ inputs.epoch }}
          INPUTS_EPOCH_FILE: ${{ inputs.epoch-file }}
          INPUTS_PEERS: ${{ inputs.peers }}
