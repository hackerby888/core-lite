name: CI
on:
  workflow_call:
  push:
    branches: ["**", "!feat/dynamic-contracts"]
  pull_request:
    branches: ["**", "!feat/dynamic-contracts"]
jobs:
  build-linux:
    uses: ./.github/workflows/linux-build.yml
    with:
      configuration: Release

  build-linux-avx512:
    uses: ./.github/workflows/linux-build-avx512.yml
    with:
      configuration: Release

  build-windows:
    uses: ./.github/workflows/windows-build.yml
    with:
      configuration: Release
