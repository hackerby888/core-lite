name: Docker Weekly

on:
  workflow_dispatch: # triggered by scheduler workflow or manually

# Publishes to Docker Hub, not to this repository.
permissions:
  contents: read

concurrency:
  group: docker-weekly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-docker-latest:
    name: publish-docker-latest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t qubiccore/lite:latest -f docker/orchestrator/Dockerfile .

      - name: Log in to Docker Hub
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

      - name: Push Docker image
        run: docker push qubiccore/lite:latest
