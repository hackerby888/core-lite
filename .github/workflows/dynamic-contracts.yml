name: Dynamic Contract Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Build and smoke the node on the same runner so every supported platform gates.
  build-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            key: linux-x64
            cc: clang-18
            cxx: clang++-18
            release_file: Qubic-linux-x64
          - runner: ubuntu-24.04-arm
            key: linux-arm64
            cc: clang-18
            cxx: clang++-18
            release_file: Qubic-linux-arm64
          - runner: macos-14
            key: darwin-arm64
            cc: clang
            cxx: clang++
            release_file: Qubic-darwin-arm64
          - runner: windows-2022
            key: windows-x64
            release_file: Qubic-windows-x64.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout core-lite
        uses: actions/checkout@v7
        with:
          path: core

      - name: Checkout qinit
        uses: actions/checkout@v7
        with:
          repository: hackerby888/qinit
          ref: main
          path: qinit

      - uses: oven-sh/setup-bun@v2

      - name: Install Linux dependencies (x64)
        if: matrix.key == 'linux-x64'
        run: |
          sudo apt update -y
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt install -y clang cmake nasm \
            libboost-stacktrace-dev libc++-dev libc++abi-dev libjsoncpp-dev uuid-dev \
            zlib1g-dev libzstd-dev g++ libstdc++-12-dev libfmt-dev liblzo2-dev \
            liblz4-dev libssl-dev libffi-dev

      - name: Install Linux dependencies (ARM64)
        if: matrix.key == 'linux-arm64'
        run: |
          sudo apt update -y
          sudo apt install -y clang-18 cmake nasm \
            libboost-stacktrace-dev libc++-dev libc++abi-dev libjsoncpp-dev uuid-dev \
            zlib1g-dev libzstd-dev g++ libfmt-dev liblzo2-dev liblz4-dev \
            libssl-dev libffi-dev

      - name: Install macOS dependencies
        if: matrix.key == 'darwin-arm64'
        run: brew install cmake nasm jq jsoncpp fmt boost lz4 zstd lzo openssl@3 zlib c-ares brotli libffi

      - name: Cache Windows dependencies
        if: matrix.key == 'windows-x64'
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-x64-windows-static-rel-${{ github.run_id }}
          restore-keys: vcpkg-x64-windows-static-rel-

      - name: Configure Windows dependencies
        if: matrix.key == 'windows-x64'
        shell: pwsh
        working-directory: core
        run: |
          New-Item -ItemType Directory -Force triplets-overlay | Out-Null
          @(
            'set(VCPKG_TARGET_ARCHITECTURE x64)',
            'set(VCPKG_CRT_LINKAGE static)',
            'set(VCPKG_LIBRARY_LINKAGE static)',
            'set(VCPKG_BUILD_TYPE release)'
          ) | Set-Content -Encoding ascii triplets-overlay/x64-windows-static-rel.cmake

      - name: Build POSIX node
        if: matrix.key != 'windows-x64'
        shell: bash
        working-directory: core
        run: |
          set -o pipefail
          BUILD_JOBS=$(getconf _NPROCESSORS_ONLN)
          CC=${{ matrix.cc }}
          CXX=${{ matrix.cxx }}
          if [ "${{ matrix.key }}" = 'darwin-arm64' ]; then
            CC=$(xcrun -f clang)
            CXX=$(xcrun -f clang++)
          fi
          {
            cmake -S . -B build-node \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_C_COMPILER="$CC" \
              -DCMAKE_CXX_COMPILER="$CXX" \
              -DBUILD_BINARY=ON \
              -DBUILD_TESTS=OFF \
              -DENABLE_AVX512=OFF \
              -DUSE_SANITIZER=OFF \
              -DTESTNET=ON \
              -DTESTNET_LITE_RAM=ON \
              -DTESTNET_PREFILL_QUS=ON \
              -DLITE_WASM_SC=ON \
              -DCMAKE_NO_USE_SWAP=ON \
              -DADDON_TX_STATUS_REQUEST=ON \
              -DONLY_LOGGING=OFF
            cmake --build build-node -- -j"$BUILD_JOBS" Qubic
          } 2>&1 | tee "$RUNNER_TEMP/node-build.log"

      - name: Upload macOS build log on failure
        if: failure() && matrix.key == 'darwin-arm64'
        uses: actions/upload-artifact@v7
        with:
          name: macos-build-log
          path: ${{ runner.temp }}/node-build.log
          if-no-files-found: ignore

      - name: Configure Windows node
        if: matrix.key == 'windows-x64'
        shell: pwsh
        working-directory: core
        run: |
          cmake -S . -B build-win-static -A x64 -T v143 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_OVERLAY_TRIPLETS="$PWD/triplets-overlay" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-rel `
            -DVCPKG_APPLOCAL_DEPS=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            '-DCMAKE_SYSTEM_VERSION=10.0' `
            -DBUILD_BINARY=ON `
            -DBUILD_TESTS=OFF `
            -DENABLE_AVX512=OFF `
            -DUSE_SANITIZER=OFF `
            -DTESTNET=ON `
            -DTESTNET_LITE_RAM=ON `
            -DTESTNET_PREFILL_QUS=ON `
            -DLITE_WASM_SC=ON `
            -DCMAKE_NO_USE_SWAP=ON `
            -DADDON_TX_STATUS_REQUEST=ON `
            -DONLY_LOGGING=OFF

      - name: Build Windows node
        if: matrix.key == 'windows-x64'
        working-directory: core
        shell: pwsh
        run: |
          cmake --build build-win-static `
            --config Release `
            --target Qubic `
            --parallel 4

      - name: Stage standalone Windows node
        if: matrix.key == 'windows-x64'
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'qinit-standalone'
          New-Item -ItemType Directory $stage | Out-Null
          $node = Join-Path $stage 'Qubic.exe'
          Copy-Item core/build-win-static/src/Release/Qubic.exe $node
          $staged = @(Get-ChildItem $stage)
          if ($staged.Count -ne 1 -or $staged[0].Name -ne 'Qubic.exe') {
            throw "standalone stage must contain only Qubic.exe: $($staged.Name -join ', ')"
          }
          "NODE_BIN=$node" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Gate Windows DLL imports and PE baseline
        if: matrix.key == 'windows-x64'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          $dumpbin = Get-ChildItem "$vs/VC/Tools/MSVC/*/bin/Hostx64/x64/dumpbin.exe" |
            Sort-Object FullName |
            Select-Object -Last 1 -ExpandProperty FullName
          if (-not $dumpbin) {
            throw 'dumpbin.exe was not found in the Visual Studio installation'
          }

          $dependencies = & $dumpbin /DEPENDENTS $env:NODE_BIN | Out-String
          $dependencies
          $imports = [regex]::Matches(
            $dependencies,
            '(?im)^\s+([A-Za-z0-9_.-]+\.dll)\s*$'
          ) | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          if (-not $imports.Count) {
            throw 'no DLL imports were detected; dumpbin output could not be validated'
          }
          $forbidden = '^(VCRUNTIME.*|MSVCP.*|ucrtbase|libffi.*|libssl.*|libcrypto.*|cares.*|zlib.*|brotli.*|blosc.*|drogon.*|trantor.*|fmt.*|jsoncpp.*)\.dll$'
          $blocked = @($imports | Where-Object { $_ -match $forbidden })
          if ($blocked.Count) {
            throw "forbidden runtime imports: $($blocked -join ', ')"
          }
          $nonSystem = @(
            $imports | Where-Object {
              $_ -notmatch '^(api|ext)-ms-win-' -and
              -not (Test-Path (Join-Path "$env:WINDIR/System32" $_))
            }
          )
          if ($nonSystem.Count) {
            throw "non-system DLL imports: $($nonSystem -join ', ')"
          }

          $headers = & $dumpbin /HEADERS $env:NODE_BIN | Out-String
          $subsystem = [regex]::Match(
            $headers,
            '(?im)^\s*(\d+)\.(\d+)\s+subsystem version\s*$'
          )
          if (-not $subsystem.Success) {
            throw 'PE subsystem version was not found'
          }
          $subsystem.Value
          if (
            [int]$subsystem.Groups[1].Value -ne 10 -or
            [int]$subsystem.Groups[2].Value -ne 0
          ) {
            throw "expected Windows 10 PE subsystem baseline, got $($subsystem.Value.Trim())"
          }

      - name: Prepare standalone Windows release node
        if: matrix.key == 'windows-x64'
        shell: pwsh
        run: |
          Copy-Item $env:NODE_BIN '${{ matrix.release_file }}'
          (Get-FileHash -Algorithm SHA256 '${{ matrix.release_file }}').Hash.ToLower() |
            Set-Content -NoNewline -Encoding ascii '${{ matrix.release_file }}.sha256'

      - name: Select built POSIX node
        if: matrix.key != 'windows-x64'
        shell: bash
        run: |
          NODE_BIN="$GITHUB_WORKSPACE/core/build-node/src/Qubic"
          chmod +x "$NODE_BIN"
          echo "NODE_BIN=$NODE_BIN" >> "$GITHUB_ENV"
          file "$NODE_BIN"

      - name: Install qinit dependencies
        shell: bash
        run: cd qinit && bun install

      - name: Build compiled qinit CLI
        shell: bash
        run: |
          cd qinit
          echo "qinit commit $(git rev-parse HEAD)"
          mkdir -p dist
          if [ "${{ matrix.key }}" = 'windows-x64' ]; then
            bun build packages/cli/src/index.tsx --compile --minify --outfile dist/qinit.exe
            echo "QINIT_BIN=$GITHUB_WORKSPACE/qinit/dist/qinit.exe" >> "$GITHUB_ENV"
          else
            bun run build:bin
            chmod +x dist/qinit
            echo "QINIT_BIN=$GITHUB_WORKSPACE/qinit/dist/qinit" >> "$GITHUB_ENV"
          fi

      - name: Compiled qinit crypto smoke
        shell: bash
        run: '"$QINIT_BIN" smoke'

      - name: Start node through compiled qinit
        shell: bash
        run: |
          "$QINIT_BIN" node run \
            --real \
            --core "$GITHUB_WORKSPACE/core" \
            --bin "$NODE_BIN" \
            --restart \
            --keep \
            --wait 150

      - name: Gate cached wasi-sdk
        shell: bash
        run: '"$QINIT_BIN" doctor'

      - name: QPI compiler/runtime parity
        shell: bash
        working-directory: qinit
        env:
          QINIT_CORE: ${{ github.workspace }}/core
          QINIT_QPI_DIGEST_FILE: ${{ github.workspace }}/qpi-${{ matrix.key }}.txt
        run: bun run scripts/ci-qpi-dual-engine.ts

      - name: Restart clean node after QPI parity
        shell: bash
        run: |
          "$QINIT_BIN" node run \
            --real \
            --core "$GITHUB_WORKSPACE/core" \
            --bin "$NODE_BIN" \
            --restart \
            --wait 150

      - name: qinit test (deploy + read + write)
        shell: bash
        run: |
          mkdir -p proj/contracts
          cp qinit/fixtures/DigestProbe.h proj/contracts/DigestProbe.h
          cd proj
          "$QINIT_BIN" test \
            --real \
            --native \
            --core "$GITHUB_WORKSPACE/core" \
            --bin "$NODE_BIN" \
            --keep \
            --contract contracts/DigestProbe.h \
            --name DigestProbe \
            --skip-verify \
            --timeout 90000

      - name: Read canonical state digest through compiled qinit
        shell: bash
        run: |
          cd proj
          STATE_JSON=$("$QINIT_BIN" state DigestProbe --digest --json)
          echo "$STATE_JSON"
          STATE_DIGEST=$(printf '%s\n' "$STATE_JSON" | jq -er '.digest')
          QPI_DIGESTS=$(cat "$GITHUB_WORKSPACE/qpi-${{ matrix.key }}.txt")
          printf '%s %s\n' "$STATE_DIGEST" "$QPI_DIGESTS" > "$GITHUB_WORKSPACE/digest-${{ matrix.key }}.txt"
          echo "::notice::${{ matrix.key }} DigestProbe state digest = $STATE_DIGEST"
          echo "::notice::${{ matrix.key }} QPI driver/callee state digests = $QPI_DIGESTS"

      - name: Stop node
        if: always() && matrix.key != 'windows-x64'
        shell: bash
        run: |
          if [ -n "${QINIT_BIN:-}" ] && [ -f "$QINIT_BIN" ]; then
            "$QINIT_BIN" node stop
          fi

      - name: Stop Windows node
        if: always() && matrix.key == 'windows-x64'
        shell: pwsh
        run: |
          if (-not $env:QINIT_BIN -or -not (Test-Path $env:QINIT_BIN)) {
            exit 0
          }
          & $env:QINIT_BIN node stop
          if ($LASTEXITCODE -ne 0) {
            Get-Process -Name Qubic -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Milliseconds 500
          }
          if (Get-Process -Name Qubic -ErrorAction SilentlyContinue) {
            throw 'Qubic.exe is still running'
          }
          exit 0

      - name: Upload state digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.key }}
          path: digest-${{ matrix.key }}.txt
          if-no-files-found: error

      - name: Package POSIX release node
        if: (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/qinit-v')) && matrix.key != 'windows-x64'
        shell: bash
        run: |
          cp "$NODE_BIN" "${{ matrix.release_file }}"
          shasum -a 256 "${{ matrix.release_file }}" | awk '{print $1}' > "${{ matrix.release_file }}.sha256"

      - name: Upload release node
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/qinit-v')
        uses: actions/upload-artifact@v7
        with:
          name: release-node-${{ matrix.key }}
          path: |
            ${{ matrix.release_file }}
            ${{ matrix.release_file }}.sha256
          if-no-files-found: error

      - name: Diagnose contract build on failure
        if: failure()
        shell: bash
        run: |
          if [ -n "${QINIT_BIN:-}" ] && [ -f "$QINIT_BIN" ]; then
            "$QINIT_BIN" build "$GITHUB_WORKSPACE/qinit/fixtures/DigestProbe.h" \
              --name DigestProbe \
              --slot 28 \
              --core "$GITHUB_WORKSPACE/core" \
              --out "$RUNNER_TEMP/qinit-build-diag" \
              --native \
              --skip-verify \
              --json || true
          fi

      - name: Node log tail on failure
        if: failure()
        shell: bash
        run: tail -400 "$HOME/.cache/qinit/run/node.log" 2>/dev/null || true

      - name: Upload full node log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nodelog-${{ matrix.key }}
          path: ~/.cache/qinit/run/node.log
          if-no-files-found: ignore

  digest-check:
    needs: build-smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: 'digest-*'
          path: digests
          merge-multiple: true
      - name: State digests must match across platforms
        run: |
          cd digests
          echo "=== per-platform DigestProbe and QPI state digests ==="
          for digest_file in digest-*.txt; do
            echo "$digest_file -> $(cat "$digest_file")"
          done
          DIGEST_COUNT=$(find . -maxdepth 1 -name 'digest-*.txt' | wc -l)
          if [ "$DIGEST_COUNT" -ne 4 ]; then
            echo "need 4 platform digests, got $DIGEST_COUNT"
            exit 1
          fi
          UNIQUE_DIGEST_COUNT=$(cat digest-*.txt | sort -u | wc -l)
          if [ "$UNIQUE_DIGEST_COUNT" -ne 1 ]; then
            echo "::error::DIVERGENCE — contract state digests differ across platforms"
            exit 1
          fi
          FIRST_DIGEST=$(sort -u digest-*.txt)
          echo "OK: all $DIGEST_COUNT platforms agree on the DigestProbe and QPI state digests -> $FIRST_DIGEST"
