# Builds the gtest runner with the wasm-contract engine enabled and runs the wasm ABI/dispatch tests.
# Catches core changes that break the wasm engine compile or the contract<->runtime ABI (dispatch / reg /
# state / system procedures) — neither is exercised by the Windows MSBuild test workflow.
name: WasmContracts-Tests

on:
  push:
    branches: [ "main", "develop", "feat/dynamic-contracts" ]
    paths-ignore:
      - 'doc/**'
  pull_request:
    branches: [ "main", "develop", "feat/dynamic-contracts" ]
    paths-ignore:
      - 'doc/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm-tests:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake and dependencies
        run: |
          sudo apt update -y
          wget https://apt.llvm.org/llvm.sh; chmod +x llvm.sh; sudo ./llvm.sh 18;
          sudo apt install -y clang cmake nasm libffi-dev
          sudo apt install -y libboost-stacktrace-dev libc++-dev libc++abi-dev libjsoncpp-dev uuid-dev zlib1g-dev libzstd-dev g++ libstdc++-12-dev libfmt-dev liblzo2-dev liblz4-dev

      # Standalone WAMR test build (no node binary, no real seeds): BUILD_BINARY=OFF + ONLY_LOGGING=ON.
      - name: Configure (LITE_WASM_CONTRACTS + tests)
        run: |
          cmake -S . -B build-wasm-ci \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18 \
            -DBUILD_TESTS:BOOL=ON \
            -DBUILD_BINARY:BOOL=OFF \
            -DLITE_WASM_CONTRACTS:BOOL=ON \
            -DENABLE_AVX512=OFF \
            -DUSE_SANITIZER=OFF \
            -DONLY_LOGGING=ON

      - name: Build test runner
        run: cmake --build build-wasm-ci --target qubic_core_tests -- -j$(nproc)

      - name: Run wasm-contract gtests
        run: ./build-wasm-ci/test/qubic_core_tests --gtest_filter='WasmContracts.*'
