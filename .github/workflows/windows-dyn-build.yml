# Windows build coverage for TESTNET + TESTNET_LITE_RAM + LITE_WASM_SC.
# Uses CMake so it reuses the Wasm and libffi wiring
# the mainnet Qubic.sln lacks (k12_engine is Linux-only -> Windows falls to the demand-zero VirtualAlloc path).
# This is a porting probe — expect iteration: read the MSVC errors, fix, repeat. Gates nothing yet.
# Run on the fork (hackerby888/core-lite), NEVER qubic upstream.
name: windows-dyn-build

on:
  workflow_dispatch:
  push:
    branches: [feat/dynamic-contracts]
    paths:
      - 'src/**'
      - 'lib/**'
      - 'CMakeLists.txt'
      - '.github/workflows/windows-dyn-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # NOTE: nasm intentionally NOT installed. With nasm on PATH, CMake routes the MASM-syntax .asm files
      # (EDK2 SetJump/LongJump, WAMR invokeNative_em64) to nasm -fwin32 -> error. Without it, all .asm use
      # MASM (ml64). blosc2 uses C intrinsics (no nasm); WAMR's Windows asm is MASM.
      # vcpkg binary cache (files provider) persisted via actions/cache. Key ROTATES per run (github.run_id)
      # so the freshly built archives are ALWAYS re-saved; restore-keys pulls the most recent prior archives
      # and vcpkg reuses whichever ABIs still match. The old static hashFiles('vcpkg.json') key was immutable,
      # so once a (stale) cache existed it was never refreshed -> vcpkg restored 0 packages -> rebuilt every
      # run. (vcpkg's x-gha provider was removed upstream, so this is files+actions/cache, done right.)
      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-x64-win-rel-${{ github.run_id }}
          restore-keys: vcpkg-x64-win-rel-
      # Release-only overlay triplet (VCPKG_BUILD_TYPE release) — skip every port's debug variant (~2x faster).
      - name: Release-only vcpkg triplet
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force triplets-overlay | Out-Null
          @(
            'set(VCPKG_TARGET_ARCHITECTURE x64)',
            'set(VCPKG_CRT_LINKAGE dynamic)',
            'set(VCPKG_LIBRARY_LINKAGE dynamic)',
            'set(VCPKG_BUILD_TYPE release)'
          ) | Set-Content -Encoding ascii triplets-overlay/x64-windows-rel.cmake
      # vcpkg MANIFEST mode (root vcpkg.json: fmt/jsoncpp/drogon/libffi). The toolchain file auto-installs them
      # at configure (release-only triplet); WAMR is FetchContent (no vcpkg). ONLY_LOGGING=OFF uses the committed
      # testnet private_settings.h (ON collides with TESTNET on the broadcastedComputorSeeds shim).
      - name: Configure (MSVC, dynamic + wasm)
        shell: pwsh
        run: |
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT"
          # No -G: CMake auto-picks the newest installed VS generator (a pinned major fails when the runner bumps VS).
          cmake -S . -B build-win -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_OVERLAY_TRIPLETS="$PWD/triplets-overlay" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-rel `
            -DBUILD_BINARY=ON -DBUILD_TESTS=OFF -DENABLE_AVX512=OFF -DUSE_SANITIZER=OFF `
            -DTESTNET=ON -DTESTNET_LITE_RAM=ON -DTESTNET_PREFILL_QUS=ON `
            -DLITE_WASM_SC=ON -DCMAKE_NO_USE_SWAP=ON `
            -DADDON_TX_STATUS_REQUEST=ON -DONLY_LOGGING=OFF

      - name: Build Qubic
        run: |
          # Serial (no /m) so the failing target's error is unambiguous — parallel /m interleaves output and
          # buries it under drogon's. Build WAMR (vmlib, the prime Windows-port suspect) first to fail fast.
          cmake --build build-win --config Release --target vmlib
          cmake --build build-win --config Release --target Qubic

      - name: Upload binary
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: Qubic-windows-x64
          # vcpkg applocal deploys the runtime DLLs (ffi-8, openssl, c-ares, zlib, brotli) next to
          # the exe — ship the whole dir so the artifact runs standalone.
          path: build-win/src/Release/
          if-no-files-found: warn
