name: QubicCoreLite-Linux

on:
  workflow_call:
    inputs:
      configuration:
        description: "Build configuration"
        required: true
        default: "RelWithDebInfo"
        type: string
      build_dir:
        description: "Build directory"
        required: false
        default: "build"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-22.04
    outputs:
      artifact-path: ${{ steps.build.outputs.path }}
    steps:
      # Checkout source
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      # Install dependencies
      - name: Install CMake and dependencies
        run: |
          sudo apt update -y
          wget https://apt.llvm.org/llvm.sh; chmod +x llvm.sh; sudo ./llvm.sh 18;
          sudo apt install -y clang cmake nasm
          sudo apt install -y libboost-stacktrace-dev libc++-dev libc++abi-dev libjsoncpp-dev uuid-dev zlib1g-dev libzstd-dev g++ libstdc++-12-dev libfmt-dev liblzo2-dev liblz4-dev libc-ares-dev

      # Configure the project
      - name: Configure with CMake
        run: |
          cmake -S . -B ${INPUTS_BUILD_DIR} \
            -DCMAKE_BUILD_TYPE=${INPUTS_CONFIGURATION} \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DBUILD_TESTS:BOOL=ON \
            -DBUILD_BINARY:BOOL=ON \
            -DENABLE_AVX512=OFF \
            -DUSE_SANITIZER=OFF \
            -DONLY_LOGGING=ON \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18
        env:
          INPUTS_BUILD_DIR: ${{ inputs.build_dir }}
          INPUTS_CONFIGURATION: ${{ inputs.configuration }}

      # Build the project
      - name: Build with Make
        run: cmake --build ${INPUTS_BUILD_DIR} --config ${INPUTS_CONFIGURATION} -- -j$(nproc)
        env:
          INPUTS_BUILD_DIR: ${{ inputs.build_dir }}
          INPUTS_CONFIGURATION: ${{ inputs.configuration }}

      # Upload build artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: QubicLiteLinuxBuild-${{ inputs.configuration }}
          path: |
            ${{ inputs.build_dir }}
