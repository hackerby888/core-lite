# Publishes qinit turnkey assets (prebuilt node per-platform + header snapshot + sha-pinned manifest).
# Run on the fork (hackerby888/core-lite), NEVER qubic upstream. Assets use ${{ github.repository }}.
# ONLY_LOGGING=OFF embeds committed src/private_settings.h — ensure it's a PUBLIC testnet fixture.
# linux-arm64 builds on a NATIVE arm runner (ubuntu-24.04-arm) — no qemu; also runs the crypto gtests.
name: qinit-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag"
        required: true
        default: "qinit-dev"
  push:
    tags: ["qinit-v*"]

permissions:
  contents: write   # create releases + upload assets

jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - id: t
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

  # Prebuilt node, one per platform. arm64 on a native arm runner (fast, real hardware).
  node:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04,     key: linux-x64,   cc: clang-18, cxx: clang++-18 }
          - { runner: ubuntu-24.04-arm, key: linux-arm64, cc: clang-18, cxx: clang++-18 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (x64 — llvm.sh)
        if: matrix.key == 'linux-x64'
        run: |
          sudo apt update -y
          wget https://apt.llvm.org/llvm.sh; chmod +x llvm.sh; sudo ./llvm.sh 18
          sudo apt install -y clang cmake nasm \
            libboost-stacktrace-dev libc++-dev libc++abi-dev libjsoncpp-dev uuid-dev \
            zlib1g-dev libzstd-dev g++ libstdc++-12-dev libfmt-dev liblzo2-dev liblz4-dev libssl-dev

      - name: Install toolchain (arm64 — apt clang-18)
        if: matrix.key == 'linux-arm64'
        run: |
          sudo apt update -y
          sudo apt install -y clang-18 cmake nasm \
            libboost-stacktrace-dev libc++-dev libc++abi-dev libjsoncpp-dev uuid-dev \
            zlib1g-dev libzstd-dev g++ libfmt-dev liblzo2-dev liblz4-dev libssl-dev

      # Same config every platform; IS_ARM auto-detects aarch64 -> SIMDe + -fsigned-char;
      # IS_MACOS handles the Darwin link/backtrace differences.
      - name: Build node
        run: |
          J=$(getconf _NPROCESSORS_ONLN)
          cmake -S . -B build-node \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DBUILD_BINARY=ON -DBUILD_TESTS=OFF -DENABLE_AVX512=OFF -DUSE_SANITIZER=OFF \
            -DTESTNET=ON -DTESTNET_LITE_RAM=ON -DTESTNET_PREFILL_QUS=ON \
            -DLITE_DYNAMIC_CONTRACTS=ON -DCMAKE_NO_USE_SWAP=ON \
            -DADDON_TX_STATUS_REQUEST=ON -DONLY_LOGGING=OFF
          cmake --build build-node -- -j"$J" Qubic
          cp build-node/src/Qubic "Qubic-${{ matrix.key }}"
          shasum -a 256 "Qubic-${{ matrix.key }}" | awk '{print $1}' > "Qubic-${{ matrix.key }}.sha256"
          file "Qubic-${{ matrix.key }}"

      # Native validation (real hardware) — authoritative: a crypto KAT failure FAILS the job,
      # so a broken-on-platform build never ships. Pure deterministic suites (FourQ/m256/K12).
      - name: Build + run crypto gtests
        run: |
          J=$(getconf _NPROCESSORS_ONLN)
          cmake -S . -B build-tests \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DBUILD_TESTS=ON -DBUILD_BINARY=OFF -DENABLE_AVX512=OFF -DONLY_LOGGING=ON \
            -DLITE_DYNAMIC_CONTRACTS=ON -DTESTNET=ON
          cmake --build build-tests -- -j"$J" qubic_core_tests
          ./build-tests/test/qubic_core_tests --gtest_filter='TestFourQ.*:TestCore256*:KangarooTwelve*'

      - name: Upload node artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.key }}
          path: |
            Qubic-${{ matrix.key }}
            Qubic-${{ matrix.key }}.sha256
          if-no-files-found: error

  # macOS-native (Apple Silicon, Mach-O). Standalone + non-gating so the in-progress macOS port can't
  # block the linux release. Validates that the OS-layer port compiles + crypto KATs pass on real macOS.
  # Once green: fold darwin-arm64 into the publish manifest + a smoke job.
  node-macos:
    needs: resolve
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (brew)
        run: brew install llvm@18 cmake nasm jsoncpp fmt boost lz4 zstd lzo openssl@3 zlib c-ares brotli || true
      - name: Build node
        run: |
          set -o pipefail
          J=$(getconf _NPROCESSORS_ONLN)
          CC=/opt/homebrew/opt/llvm@18/bin/clang; CXX=/opt/homebrew/opt/llvm@18/bin/clang++
          ZR=$(brew --prefix zlib)        # macOS ships libz only as a .tbd stub CMake's FindZLIB misses
          LL=$(brew --prefix llvm@18)
          # drogon/trantor are built with brew llvm@18 libc++ (new exception ABI ne180100); link against
          # THAT libc++ runtime, not Apple's older system one, or those symbols are undefined.
          LDF="-L$LL/lib/c++ -L$LL/lib/unwind -Wl,-rpath,$LL/lib/c++"
          {
            cmake -S . -B build-node -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX" \
              -DCMAKE_EXE_LINKER_FLAGS="$LDF" \
              -DZLIB_ROOT="$ZR" -DZLIB_LIBRARY="$ZR/lib/libz.dylib" -DZLIB_INCLUDE_DIR="$ZR/include" \
              -DBUILD_BINARY=ON -DBUILD_TESTS=OFF -DENABLE_AVX512=OFF -DUSE_SANITIZER=OFF \
              -DTESTNET=ON -DTESTNET_LITE_RAM=ON -DTESTNET_PREFILL_QUS=ON \
              -DLITE_DYNAMIC_CONTRACTS=ON -DCMAKE_NO_USE_SWAP=ON -DADDON_TX_STATUS_REQUEST=ON -DONLY_LOGGING=OFF
            cmake --build build-node -- -j"$J" Qubic
          } 2>&1 | tee "$GITHUB_WORKSPACE/macos-build.log"
          cp build-node/src/Qubic Qubic-darwin-arm64
          shasum -a 256 Qubic-darwin-arm64 | awk '{print $1}' > Qubic-darwin-arm64.sha256
          file Qubic-darwin-arm64
      # Publish the build log to a public debug release so failures are diagnosable without CI-log auth.
      - name: Publish macOS build log (debug)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tail -c 200000 "$GITHUB_WORKSPACE/macos-build.log" > macos-build.tail.log || true
          gh release create qinit-macos-debug macos-build.tail.log -t "macOS build debug" -n "node-macos build log (errors tail)" \
          || gh release upload qinit-macos-debug macos-build.tail.log --clobber
      - name: Build + run crypto gtests
        run: |
          J=$(getconf _NPROCESSORS_ONLN)
          CC=/opt/homebrew/opt/llvm@18/bin/clang; CXX=/opt/homebrew/opt/llvm@18/bin/clang++
          LL=$(brew --prefix llvm@18); LDF="-L$LL/lib/c++ -L$LL/lib/unwind -Wl,-rpath,$LL/lib/c++"
          cmake -S . -B build-tests -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$CC" -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_EXE_LINKER_FLAGS="$LDF" \
            -DBUILD_TESTS=ON -DBUILD_BINARY=OFF -DENABLE_AVX512=OFF -DONLY_LOGGING=ON \
            -DLITE_DYNAMIC_CONTRACTS=ON -DTESTNET=ON
          cmake --build build-tests -- -j"$J" qubic_core_tests
          ./build-tests/test/qubic_core_tests --gtest_filter='TestFourQ.*:TestCore256*:KangarooTwelve*'
      - uses: actions/upload-artifact@v4
        with:
          name: node-darwin-arm64
          path: |
            Qubic-darwin-arm64
            Qubic-darwin-arm64.sha256
          if-no-files-found: error

  # Readable runtime smoke per platform: boot the built node, confirm the tick advances via RPC.
  # Does NOT gate the release (publish needs [node, headers]) — but its conclusion is authoritative:
  # a crash / no-tick FAILS this job, so the result is visible (incl. OOM on a small runner).
  smoke:
    needs: node
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04,     key: linux-x64 }
          - { runner: ubuntu-24.04-arm, key: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: node-${{ matrix.key }}
      - name: Boot + tick
        run: |
          chmod +x "Qubic-${{ matrix.key }}"
          free -h || true
          mkdir run && cd run
          nohup "../Qubic-${{ matrix.key }}" --peers 127.0.0.1 --node-mode 3 --ticking-delay 1000 > node.log 2>&1 &
          PID=$!
          ok=0; T0=""
          for i in $(seq 1 40); do
            sleep 3
            if ! kill -0 $PID 2>/dev/null; then echo "node process exited early"; break; fi
            t=$(curl -s http://127.0.0.1:41841/tick-info 2>/dev/null | grep -oE '"tick"[^0-9]*[0-9]+' | grep -oE '[0-9]+$')
            [ -z "$t" ] && continue
            if [ -z "$T0" ]; then T0=$t; echo "first tick=$T0"; continue; fi
            if [ "$t" -gt "$T0" ]; then ok=1; echo "TICKING: $T0 -> $t"; break; fi
          done
          kill $PID 2>/dev/null || true; sleep 1
          echo "=== crash markers ==="; grep -ciE "segmentation|signal 11|abort|bad_alloc|out of memory" node.log || true
          echo "=== log tail ==="; tail -15 node.log
          if [ "$ok" != "1" ]; then echo "RESULT: node did NOT tick on ${{ matrix.key }}"; exit 1; fi
          echo "RESULT: node TICKED on ${{ matrix.key }}"

  headers:
    needs: resolve
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt update -y
          wget https://apt.llvm.org/llvm.sh; chmod +x llvm.sh; sudo ./llvm.sh 18
          sudo apt install -y clang
      - name: Build header snapshot
        run: |
          CLANG=clang++-18 bash scripts/qinit-header-snapshot.sh "$PWD/snapshot-out"
          cp snapshot-out/core-headers.tar.gz ./core-headers.tar.gz
          cp snapshot-out/core-headers.sha256 ./core-headers.sha256
      - uses: actions/upload-artifact@v4
        with: { name: headers, path: "core-headers.*", if-no-files-found: error }

  publish:
    needs: [resolve, node, headers]
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}   # gh needs this without a checkout
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: "node-*", merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: headers, path: dist }
      - name: Generate manifest
        working-directory: dist
        run: |
          BASE="https://github.com/${{ github.repository }}/releases/download/$TAG"
          x64sha=$(cat Qubic-linux-x64.sha256); armsha=$(cat Qubic-linux-arm64.sha256)
          hsha=$(cat core-headers.sha256)
          cat > qinit-manifest.json <<EOF
          {
            "version": "$TAG",
            "node":    { "url": "$BASE/Qubic-linux-x64", "sha256": "$x64sha" },
            "nodes": {
              "linux-x64":   { "url": "$BASE/Qubic-linux-x64",   "sha256": "$x64sha" },
              "linux-arm64": { "url": "$BASE/Qubic-linux-arm64", "sha256": "$armsha" }
            },
            "headers": { "url": "$BASE/core-headers.tar.gz", "sha256": "$hsha" }
          }
          EOF
          cat qinit-manifest.json
      - name: Publish release
        working-directory: dist
        run: |
          gh release create "$TAG" Qubic-linux-x64 Qubic-linux-arm64 core-headers.tar.gz qinit-manifest.json \
            --title "$TAG" --notes "qinit turnkey: prebuilt dynamic-contract node (linux-x64 + linux-arm64) + core-header snapshot" \
          || gh release upload "$TAG" Qubic-linux-x64 Qubic-linux-arm64 core-headers.tar.gz qinit-manifest.json --clobber
