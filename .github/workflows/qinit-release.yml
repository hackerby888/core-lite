# Publishes prebuilt nodes, the core header snapshot, and a pinned manifest.
# Fork-only: ONLY_LOGGING=OFF embeds the public testnet settings.
name: qinit-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag"
        required: true
        default: "qinit-dev"
  push:
    # Tags and manual runs publish releases. Branch pushes and PRs only build and smoke-test.
    branches: [feat/dynamic-contracts]
    tags: ["qinit-v*"]
    paths:
      - 'src/**'
      - 'lib/**'
      - 'CMakeLists.txt'
      - '.github/workflows/qinit-release.yml'
  pull_request:
    branches: [feat/dynamic-contracts]
    paths:
      - 'src/**'
      - 'lib/**'
      - 'CMakeLists.txt'
      - '.github/workflows/qinit-release.yml'

permissions:
  contents: write   # create releases + upload assets

jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.t.outputs.tag }}
    steps:
      - id: t
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

  # Build Linux nodes on native runners.
  node:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            key: linux-x64
            cc: clang-18
            cxx: clang++-18
          - runner: ubuntu-24.04-arm
            key: linux-arm64
            cc: clang-18
            cxx: clang++-18
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain (x64 — llvm.sh)
        if: matrix.key == 'linux-x64'
        run: |
          sudo apt update -y
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt install -y clang cmake nasm \
            libboost-stacktrace-dev libc++-dev libc++abi-dev libjsoncpp-dev uuid-dev \
            zlib1g-dev libzstd-dev g++ libstdc++-12-dev libfmt-dev liblzo2-dev liblz4-dev libssl-dev libffi-dev

      - name: Install toolchain (arm64 — apt clang-18)
        if: matrix.key == 'linux-arm64'
        run: |
          sudo apt update -y
          sudo apt install -y clang-18 cmake nasm \
            libboost-stacktrace-dev libc++-dev libc++abi-dev libjsoncpp-dev uuid-dev \
            zlib1g-dev libzstd-dev g++ libfmt-dev liblzo2-dev liblz4-dev libssl-dev libffi-dev

      - name: Build node
        run: |
          BUILD_JOBS=$(getconf _NPROCESSORS_ONLN)
          cmake -S . -B build-node \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} \
            -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DBUILD_BINARY=ON \
            -DBUILD_TESTS=OFF \
            -DENABLE_AVX512=OFF \
            -DUSE_SANITIZER=OFF \
            -DTESTNET=ON \
            -DTESTNET_LITE_RAM=ON \
            -DTESTNET_PREFILL_QUS=ON \
            -DLITE_WASM_SC=ON \
            -DCMAKE_NO_USE_SWAP=ON \
            -DADDON_TX_STATUS_REQUEST=ON \
            -DONLY_LOGGING=OFF
          cmake --build build-node -- -j"$BUILD_JOBS" Qubic
          cp build-node/src/Qubic "Qubic-${{ matrix.key }}"
          shasum -a 256 "Qubic-${{ matrix.key }}" \
            | awk '{print $1}' > "Qubic-${{ matrix.key }}.sha256"
          file "Qubic-${{ matrix.key }}"

      - name: Upload node artifact
        uses: actions/upload-artifact@v7
        with:
          name: node-${{ matrix.key }}
          path: |
            Qubic-${{ matrix.key }}
            Qubic-${{ matrix.key }}.sha256
          if-no-files-found: error

  # The macOS artifact is optional and does not block Linux releases.
  node-macos:
    needs: resolve
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (brew)
        run: brew install cmake nasm jsoncpp fmt boost lz4 zstd lzo openssl@3 zlib c-ares brotli libffi || true
      - name: Build node
        run: |
          set -o pipefail
          BUILD_JOBS=$(getconf _NPROCESSORS_ONLN)
          # Apple clang keeps the compiler headers and system libc++ ABI aligned.
          CC=$(xcrun -f clang)
          CXX=$(xcrun -f clang++)
          {
            cmake -S . -B build-node \
              -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_C_COMPILER="$CC" \
              -DCMAKE_CXX_COMPILER="$CXX" \
              -DBUILD_BINARY=ON \
              -DBUILD_TESTS=OFF \
              -DENABLE_AVX512=OFF \
              -DUSE_SANITIZER=OFF \
              -DTESTNET=ON \
              -DTESTNET_LITE_RAM=ON \
              -DTESTNET_PREFILL_QUS=ON \
              -DLITE_WASM_SC=ON \
              -DCMAKE_NO_USE_SWAP=ON \
              -DADDON_TX_STATUS_REQUEST=ON \
              -DONLY_LOGGING=OFF
            cmake --build build-node -- -j"$BUILD_JOBS" Qubic
          } 2>&1 | tee "$GITHUB_WORKSPACE/macos-build.log"
          cp build-node/src/Qubic Qubic-darwin-arm64
          shasum -a 256 Qubic-darwin-arm64 | awk '{print $1}' > Qubic-darwin-arm64.sha256
          file Qubic-darwin-arm64
      # Keep a public log tail for failed macOS builds.
      - name: Publish macOS build log (debug)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tail -c 250000 "$GITHUB_WORKSPACE/macos-build.log" > macos-build.tail.log || true
          gh release create qinit-macos-debug macos-build.tail.log -t "macOS build debug" -n "node-macos build+test log (tail)" \
          || gh release upload qinit-macos-debug macos-build.tail.log --clobber
      - uses: actions/upload-artifact@v7
        with:
          name: node-darwin-arm64
          path: |
            Qubic-darwin-arm64
            Qubic-darwin-arm64.sha256
          if-no-files-found: error

  # Keep this optional Windows build aligned with windows-dyn-build.yml.
  node-windows:
    needs: resolve
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      # Rotate the cache key so updated vcpkg archives are saved after each run.
      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-x64-win-rel-${{ github.run_id }}
          restore-keys: vcpkg-x64-win-rel-
      - name: Release-only vcpkg triplet
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force triplets-overlay | Out-Null
          @(
            'set(VCPKG_TARGET_ARCHITECTURE x64)',
            'set(VCPKG_CRT_LINKAGE dynamic)',
            'set(VCPKG_LIBRARY_LINKAGE dynamic)',
            'set(VCPKG_BUILD_TYPE release)'
          ) | Set-Content -Encoding ascii triplets-overlay/x64-windows-rel.cmake
      - name: Configure (MSVC, dynamic + wasm)
        shell: pwsh
        run: |
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT"
          # Let CMake select the Visual Studio version installed on the runner.
          cmake -S . -B build-win -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_OVERLAY_TRIPLETS="$PWD/triplets-overlay" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-rel `
            -DBUILD_BINARY=ON -DBUILD_TESTS=OFF -DENABLE_AVX512=OFF -DUSE_SANITIZER=OFF `
            -DTESTNET=ON -DTESTNET_LITE_RAM=ON -DTESTNET_PREFILL_QUS=ON `
            -DLITE_WASM_SC=ON -DCMAKE_NO_USE_SWAP=ON `
            -DADDON_TX_STATUS_REQUEST=ON -DONLY_LOGGING=OFF
      - name: Build Qubic
        run: cmake --build build-win --config Release --target Qubic --parallel 4
      - name: Upload node artifact
        uses: actions/upload-artifact@v7
        with:
          name: node-windows-x64
          # vcpkg places required runtime DLLs beside Qubic.exe.
          path: build-win/src/Release/
          if-no-files-found: error
      # Package Qubic.exe and its applocal DLLs as the flat archive qinit expects.
      - name: Package node bundle (exe + applocal DLLs) for release
        shell: pwsh
        run: |
          tar -czf Qubic-windows-x64.tar.gz -C build-win/src/Release .
          (Get-FileHash -Algorithm SHA256 Qubic-windows-x64.tar.gz).Hash.ToLower() |
            Set-Content -NoNewline -Encoding ascii Qubic-windows-x64.tar.gz.sha256
      - name: Upload windows release bundle
        uses: actions/upload-artifact@v7
        with:
          name: node-windows-release
          path: |
            Qubic-windows-x64.tar.gz
            Qubic-windows-x64.tar.gz.sha256
          if-no-files-found: error

  # Reuse the platform suite as the release test gate.
  release-platform-tests:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: resolve
    uses: ./.github/workflows/platform-tests.yml

  # Deploy DigestProbe and verify its read/write path on every built platform.
  smoke:
    needs: [node, node-macos, node-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            key: linux-x64
            artifact: node-linux-x64
          - runner: ubuntu-24.04-arm
            key: linux-arm64
            artifact: node-linux-arm64
          - runner: macos-14
            key: darwin-arm64
            artifact: node-darwin-arm64
          - runner: windows-latest
            key: windows-x64
            artifact: node-windows-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout core-lite (--core, wasm contract headers)
        uses: actions/checkout@v7
        with:
          path: core
      - name: Checkout qinit (the test runner)
        uses: actions/checkout@v7
        with:
          repository: hackerby888/qinit
          ref: main
          path: qinit
      - uses: oven-sh/setup-bun@v2
      - name: Install qinit deps
        shell: bash
        run: cd qinit && bun install
      - name: Build qinit CLI
        shell: bash
        run: |
          cd qinit
          echo "qinit commit $(git rev-parse HEAD)"
          mkdir -p dist
          if [ "${{ matrix.key }}" = "windows-x64" ]; then
            bun build packages/cli/src/index.tsx --compile --minify --outfile dist/qinit.exe
            echo "QINIT_BIN=$GITHUB_WORKSPACE/qinit/dist/qinit.exe" >> "$GITHUB_ENV"
          else
            bun run build:bin
            chmod +x dist/qinit
            echo "QINIT_BIN=$GITHUB_WORKSPACE/qinit/dist/qinit" >> "$GITHUB_ENV"
          fi
      - name: Compiled qinit crypto smoke
        shell: bash
        run: |
          "$QINIT_BIN" smoke
      # Install the keg-only libraries linked by the macOS node.
      - name: Install macOS runtime libs
        if: matrix.key == 'darwin-arm64'
        run: brew install jq jsoncpp fmt boost lz4 zstd lzo openssl@3 zlib c-ares brotli libffi || true
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
      - name: Select node artifact
        shell: bash
        run: |
          if [ "${{ matrix.key }}" = "windows-x64" ]; then
            NODE_BIN="$GITHUB_WORKSPACE/Qubic.exe"
          else
            cp "Qubic-${{ matrix.key }}" Qubic
            chmod +x Qubic
            NODE_BIN="$GITHUB_WORKSPACE/Qubic"
          fi
          echo "NODE_BIN=$NODE_BIN" >> "$GITHUB_ENV"
      - name: Start release node through compiled qinit
        shell: bash
        run: |
          "$QINIT_BIN" node run \
            --real \
            --core "$GITHUB_WORKSPACE/core" \
            --bin "$NODE_BIN" \
            --restart \
            --keep \
            --wait 150
      - name: Gate cached wasi-sdk
        shell: bash
        run: |
          "$QINIT_BIN" doctor
      - name: qinit test (deploy + read + write)
        shell: bash
        run: |
          mkdir -p proj/contracts
          cp qinit/fixtures/DigestProbe.h proj/contracts/DigestProbe.h
          cd proj
          # The known-good fixture skips the separate x64-only contractverify gate.
          "$QINIT_BIN" test \
            --real \
            --native \
            --core "$GITHUB_WORKSPACE/core" \
            --contract contracts/DigestProbe.h \
            --name DigestProbe \
            --skip-verify \
            --timeout 90000
      - name: Read canonical state digest through compiled qinit
        shell: bash
        run: |
          cd proj
          STATE_JSON=$("$QINIT_BIN" state DigestProbe --digest --json)
          echo "$STATE_JSON"
          STATE_DIGEST=$(printf '%s\n' "$STATE_JSON" | jq -er '.digest')
          echo "$STATE_DIGEST" > "$GITHUB_WORKSPACE/digest-${{ matrix.key }}.txt"
          echo "::notice::${{ matrix.key }} DigestProbe state digest = $STATE_DIGEST"
      - name: Stop node
        if: always()
        shell: bash
        run: |
          if [ -n "${QINIT_BIN:-}" ] && [ -f "$QINIT_BIN" ]; then
            "$QINIT_BIN" node stop
          fi
      - name: Upload state digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.key }}
          path: digest-${{ matrix.key }}.txt
          if-no-files-found: error
      # Rebuild directly to expose compiler diagnostics hidden by qinit test.
      - name: Diagnose contract build (on failure)
        if: failure()
        shell: bash
        run: |
          if [ -n "${QINIT_BIN:-}" ] && [ -f "$QINIT_BIN" ]; then
            "$QINIT_BIN" build "$GITHUB_WORKSPACE/qinit/fixtures/DigestProbe.h" \
              --name DigestProbe \
              --slot 28 \
              --core "$GITHUB_WORKSPACE/core" \
              --out "$RUNNER_TEMP/qinit-build-diag" \
              --native \
              --skip-verify \
              --json || true
          fi
      - name: Node log tail (on failure)
        if: failure()
        shell: bash
        run: tail -400 "$HOME/.cache/qinit/run/node.log" 2>/dev/null || true
      # Keep the full log when a short failure tail is insufficient.
      - name: Upload full node log (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nodelog-${{ matrix.key }}
          path: ~/.cache/qinit/run/node.log
          if-no-files-found: ignore

  # Require byte-identical contract state across all successful platform builds.
  digest-check:
    needs: smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: 'digest-*'
          path: digests
          merge-multiple: true
      - name: State digests must match across platforms
        run: |
          cd digests
          echo "=== per-platform DigestProbe state digest ==="
          for digest_file in digest-*.txt; do
            echo "$digest_file -> $(cat "$digest_file")"
          done
          DIGEST_COUNT=$(find . -maxdepth 1 -name 'digest-*.txt' | wc -l)
          if [ "$DIGEST_COUNT" -lt 2 ]; then
            echo "need >=2 platform digests, got $DIGEST_COUNT"
            exit 1
          fi
          UNIQUE_DIGEST_COUNT=$(cat digest-*.txt | sort -u | wc -l)
          if [ "$UNIQUE_DIGEST_COUNT" -ne 1 ]; then
            echo "::error::DIVERGENCE — contract state digest differs across platforms"
            exit 1
          fi
          FIRST_DIGEST=$(cat digest-*.txt | head -1)
          echo "OK: all $DIGEST_COUNT platforms agree on the DigestProbe state digest -> $FIRST_DIGEST"

  headers:
    # Branch pushes do not generate release assets.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: resolve
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Fetch wasi-sdk-29 (for the wasm header closure)
        run: |
          curl -fsSL -o wasi-sdk.tar.gz \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-29/wasi-sdk-29.0-x86_64-linux.tar.gz
          mkdir -p wasi-sdk
          tar -xzf wasi-sdk.tar.gz -C wasi-sdk --strip-components=1
      - name: Build header snapshot
        run: |
          WASM_CLANG="$PWD/wasi-sdk/bin/clang++" \
          WASI_SYSROOT="$PWD/wasi-sdk/share/wasi-sysroot" \
            bash scripts/qinit-header-snapshot.sh "$PWD/snapshot-out"
          cp snapshot-out/core-headers.tar.gz ./core-headers.tar.gz
          cp snapshot-out/core-headers.sha256 ./core-headers.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: headers
          path: "core-headers.*"
          if-no-files-found: error

  publish:
    # Publish only after release assets and platform checks succeed.
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs:
      - resolve
      - node
      - node-macos
      - node-windows
      - release-platform-tests
      - headers
      - smoke
      - digest-check
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "node-*"
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: headers
          path: dist
      - name: Generate manifest
        working-directory: dist
        run: |
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/$TAG"
          LINUX_X64_SHA=$(cat Qubic-linux-x64.sha256)
          LINUX_ARM64_SHA=$(cat Qubic-linux-arm64.sha256)
          HEADERS_SHA=$(cat core-headers.sha256)
          # Optional platform entries appear only when their builds succeeded.
          DARWIN_ENTRY=""
          if [ -f Qubic-darwin-arm64.sha256 ]; then
            DARWIN_SHA=$(cat Qubic-darwin-arm64.sha256)
            DARWIN_ENTRY=",
              \"darwin-arm64\": { \"url\": \"$BASE_URL/Qubic-darwin-arm64\", \"sha256\": \"$DARWIN_SHA\" }"
          fi
          WINDOWS_ENTRY=""
          if [ -f Qubic-windows-x64.tar.gz.sha256 ]; then
            WINDOWS_SHA=$(cat Qubic-windows-x64.tar.gz.sha256)
            WINDOWS_ENTRY=",
              \"windows-x64\": { \"url\": \"$BASE_URL/Qubic-windows-x64.tar.gz\", \"sha256\": \"$WINDOWS_SHA\" }"
          fi
          cat > qinit-manifest.json <<EOF
          {
            "version": "$TAG",
            "node":    { "url": "$BASE_URL/Qubic-linux-x64", "sha256": "$LINUX_X64_SHA" },
            "nodes": {
              "linux-x64":   { "url": "$BASE_URL/Qubic-linux-x64",   "sha256": "$LINUX_X64_SHA" },
              "linux-arm64": { "url": "$BASE_URL/Qubic-linux-arm64", "sha256": "$LINUX_ARM64_SHA" }$DARWIN_ENTRY$WINDOWS_ENTRY
            },
            "headers": { "url": "$BASE_URL/core-headers.tar.gz", "sha256": "$HEADERS_SHA" }
          }
          EOF
          cat qinit-manifest.json
      - name: Publish release
        working-directory: dist
        run: |
          RELEASE_FILES="Qubic-linux-x64 Qubic-linux-arm64 core-headers.tar.gz qinit-manifest.json"
          RELEASE_PLATFORMS="linux-x64 + linux-arm64"
          if [ -f Qubic-darwin-arm64 ]; then
            RELEASE_FILES="$RELEASE_FILES Qubic-darwin-arm64"
            RELEASE_PLATFORMS="$RELEASE_PLATFORMS + darwin-arm64"
          fi
          if [ -f Qubic-windows-x64.tar.gz ]; then
            RELEASE_FILES="$RELEASE_FILES Qubic-windows-x64.tar.gz"
            RELEASE_PLATFORMS="$RELEASE_PLATFORMS + windows-x64"
          fi
          gh release create "$TAG" $RELEASE_FILES \
            --title "$TAG" \
            --notes "qinit turnkey: prebuilt dynamic-contract node ($RELEASE_PLATFORMS) + core-header snapshot" \
            || gh release upload "$TAG" $RELEASE_FILES --clobber
